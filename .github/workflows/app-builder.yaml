---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: App Builder

on:
  workflow_call:
    inputs:
      app:
        type: string
        description: App Name
        required: true
      release:
        type: boolean
        description: Release
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.meta.outputs.platforms }}
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false

      - name: Get App Meta
        uses: ./.github/actions/app-meta
        id: meta
        with:
          app: ${{ inputs.app }}

      - name: Compute Tags
        id: tags
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          RELEASE: ${{ inputs.release }}
        run: |-
          if [[ "${RELEASE}" != "true" ]]; then
            echo 'tags=["sandbox"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tags=("rolling" "${VERSION#v}")
          if [[ "${VERSION#v}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            tags+=("${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" "${BASH_REMATCH[1]}")
          fi
          echo "tags=$(printf '%s\n' "${tags[@]}" | jq --raw-input . | jq --slurp --compact-output 'unique')" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs:
      - plan
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.plan.outputs.platforms) }}
    runs-on: ${{ startsWith(matrix.platform, 'linux/arm') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false

      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: containers-nix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        id: push
        env:
          APP: ${{ inputs.app }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.plan.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.app }}
        run: |-
          ARCH="${PLATFORM##*/}"
          case "${ARCH}" in
            amd64) SYSTEM=x86_64-linux ;;
            arm64) SYSTEM=aarch64-linux ;;
            *) echo "unsupported platform ${PLATFORM}"; exit 1 ;;
          esac
          OUT=$(nix build ".#packages.${SYSTEM}.${APP}" --no-link --print-out-paths -L)
          "${OUT}" | nix run --inputs-from . nixpkgs#skopeo -- copy \
            --insecure-policy \
            --dest-compress-format zstd \
            --digestfile "${RUNNER_TEMP}/digest.txt" \
            docker-archive:/dev/stdin \
            "docker://${IMAGE}:${VERSION#v}-${ARCH}"
          DIGEST=$(cat "${RUNNER_TEMP}/digest.txt")
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "arch=${ARCH}" >> "$GITHUB_OUTPUT"
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload Digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.app }}-digests-${{ steps.push.outputs.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge
    runs-on: ubuntu-latest
    needs:
      - plan
      - build
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Download Digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: ${{ inputs.app }}-digests-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Manifest List and Push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.app }}
          TAGS: ${{ needs.plan.outputs.tags }}
        run: |-
          docker buildx imagetools create \
            $(jq --raw-output --arg image "${IMAGE}" '.[] | "-t \($image):\(.)"' <<<"${TAGS}" | tr '\n' ' ') \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Export Digest
        id: digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.app }}
          TAG: ${{ fromJson(needs.plan.outputs.tags)[0] }}
        run: |-
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{ json . }}' | jq --raw-output '.manifest.digest')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  attest:
    name: Attest
    needs:
      - merge
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          push-to-registry: true
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.app }}
          subject-digest: ${{ needs.merge.outputs.digest }}

  test:
    if: ${{ ! inputs.release }}
    name: Test
    needs:
      - merge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run App Tests
        env:
          APP: ${{ inputs.app }}
          TEST_IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.app }}@${{ needs.merge.outputs.digest }}
        run: |-
          go test -v ./apps/${APP}/...
